# Local smoke check only (AGENTS.md: keep smoke checks local) -- exercises round-3 ideas A6 (CAPI
# clustering targets beside JEPA smooth-L1) and A7 (inverse block masking with circular roll)
# together before spending a full run on either. Not labless-eligible (max_train_samples/flops
# deliberately tiny).
project:
  name: nanopath-smoke-capi-roll
  family: nanopath
  recipe_id: dinov2-vits14-reg-jepa-mask10
  output_dir: /data/$USER/nanopath/main/nanopath-smoke-capi-roll
  wandb_dir: /data/$USER/nanopath/wandb
data:
  dataset_dir: /data/nanopath_parquet
  split_seed: 7777
  val_fraction: 0.05
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  global_crop_scale:
  - 0.4
  - 1.0
  local_crop_scale:
  - 0.08
  - 0.35
  color_jitter: 0.3
  color_jitter_saturation: 0.30
  hed_jitter: 0.07
  tissue_thresh: 0.0
model:
  type: dinov2_vits14_reg
train:
  robust_norm: true
  seed: 9876
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 10240
  max_train_flops: 1000000000000000000
  log_every: 5
  save_every: 100000
  eval_every: 100000
  val_batches: 2
  global_views: 2
  local_views: 14
  global_size: 224
  local_size: 128
  resume: null
dino:
  lr: 0.000125
  lr_key: sample
  lr_min: 1.0e-06
  adam_beta2: 0.999
  warmup_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.1
  kde_concentration: 10.0
  jepa_pred_depth: 10
  jepa_pred_width: 0
  jepa_pred_scratch: 5
  jepa_target_blocks: []
  jepa_loss: smooth_l1
  jepa_focal_gamma: 0.0
  jepa_blocks: 4
  jepa_block_scale: 0.1
  freeze_backbone_fraction: 0.0
  capi_weight: 0.15
  capi_protos: 512
  inverse_block_mask: true
probe:
  enabled: false
  model_weights: ema
  count: 0
  datasets: []
  segmentation_datasets: []
  slide_datasets: []
  auc_datasets: []
  survival_datasets: []
  robustness_datasets: []
  dataset_roots: {}
fino:
  enabled: false
