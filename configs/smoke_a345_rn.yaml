# Local smoke check only -- exercises A3 (xsite) + A4 (site_center) + A5 (stain) together
# on top of the REAL robust-norm-v2 recipe (JEPA predictor + FINO + RobustNorm), not the
# plain-DINO fallback. Not labless-eligible (tiny sample cap, probe disabled).
project: {name: smoke-a345-rn, family: nanopath, recipe_id: dinov2-vits14-reg-jepa-mask10,
  output_dir: /data/$USER/nanopath/main/smoke-a345-rn, wandb_dir: /data/$USER/nanopath/wandb}
data:
  dataset_dir: /data/nanopath_parquet
  split_seed: 7777
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.08, 0.35]
  color_jitter: 0.3
  color_jitter_saturation: 0.3
  hed_jitter: 0.07
  tissue_thresh: 0.0
model: {type: robust_norm_dinov2_vits14_reg}
train: {robust_norm: true, seed: 9876, bf16: true, activation_checkpointing: false,
  batch_size: 128, num_workers: 16, prefetch_factor: 2, persistent_workers: true,
  max_train_samples: 16384, max_train_flops: 1000000000000000000, log_every: 5, save_every: 100000,
  eval_every: 100000, val_batches: 2, global_views: 2, local_views: 14, global_size: 224,
  local_size: 128, resume: null}
dino: {lr: 0.000125, lr_min: 1.0e-06, adam_beta2: 0.999, warmup_fraction: 0.0909,
  freeze_last_layer_fraction: 0.0091, layerwise_decay: 0.7, patch_embed_lr_mult: 0.2,
  drop_path_rate: 0.1, head_hidden_dim: 2048, head_bottleneck_dim: 384, clip_grad: 3.0,
  kde_loss_weight: 0.1, kde_concentration: 10.0, jepa_pred_depth: 4, jepa_pred_width: 0,
  jepa_blocks: 4, jepa_block_scale: 0.1, xsite_weight: 0.15, xsite_queue_size: 8192,
  site_center: true, stain_weight: 0.15}
probe:
  enabled: false
  model_weights: ema
  count: 0
  datasets: []
  segmentation_datasets: []
  slide_datasets: []
  auc_datasets: []
  survival_datasets: []
  robustness_datasets: []
  dataset_roots: {bach: /data/thunder-data/bach, bracs: /data/thunder-data/bracs,
    break_his: /data/thunder-data/break_his, crc: /data/thunder-data/crc, esca: /data/thunder-data/esca,
    mhist: /data/thunder-data/mhist, pcam: /data/thunder-data/patch_camelyon, spider_breast: /data/thunder-data/spider_breast,
    spider_colorectal: /data/thunder-data/spider_colorectal, spider_skin: /data/thunder-data/spider_skin,
    spider_thorax: /data/thunder-data/spider_thorax, wilds: /data/thunder-data/wilds,
    pannuke: /data/thunder-data/pannuke, segpath_epithelial: /data/thunder-data/segpath_epithelial,
    segpath_lymphocytes: /data/thunder-data/segpath_lymphocytes, cptac_pda_os: /data/CPTAC-PDA,
    leopard_bcr: /data/leopard_bcr, pathorob: /data/pathorob, surgen: /data/surgen,
    ucla_lung: /data/ucla-lung}
fino:
  enabled: true
  gamma_max: 0.7
  discrete:
  - [subtype, 1]
  continuous:
  - [expr512, 1]
  - [fga, 1]
